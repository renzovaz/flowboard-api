# Atualizações automáticas de dependências. Cada PR do Dependabot passa pelo mesmo CI
# (inclusive locked mode e NuGet Audit) antes de poder ser integrado.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore"]
    commit-message:
      prefix: "build(deps)"
    # Projeto fixado no .NET 10 LTS (ADR-003): sem saltos de versão major dos pacotes da plataforma.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Swashbuckle.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["type:ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["type:security"]
    commit-message:
      prefix: "build(docker)"
    # Mantém o .NET 10 LTS (ADR-003): atualiza digest/patch, mas não para o .NET 11.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

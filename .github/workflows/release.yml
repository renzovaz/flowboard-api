# Pipeline de entrega (Continuous Delivery) do FlowBoard API.
# Disparado por uma tag SemVer (vX.Y.Z) criada sobre um commit da main.
#
#   guard ──► verify (ci.yml reutilizado) ──► image ──► github-release
#
# Resultado: imagem escaneada pelo Trivy, publicada no GHCR (tags X.Y.Z, sha-<7>, latest)
# e um GitHub Release com versão ↔ commit ↔ digest (release-manifest.json).
# O deploy usa SEMPRE o digest (referência imutável), nunca a tag (ADR-021).
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Menor privilégio: nada por padrão; cada job declara o que precisa.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Garante que a tag é SemVer e que o commit pertence à main (código revisado e integrado).
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar tag e verificar se o commit pertence à main
        id: check
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$tag' fora do formato vX.Y.Z"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          # Garante a referência origin/main atualizada, independentemente do checkout.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # ^{commit} resolve tags anotadas (que apontam para um objeto "tag", não para o commit).
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::O commit $commit da tag $tag não pertence à main"; exit 1
          fi
          echo "Tag $tag → commit $commit (pertence à main)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Reutiliza o CI inteiro (build, testes, cobertura, auditorias) no commit exato da tag.
  # Um workflow chamado só pode ter permissões iguais ou menores que as do chamador:
  # por isso estas permissões cobrem todos os jobs declarados no ci.yml (mesmo os pulados).
  verify:
    name: verify
    needs: guard
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      is-release: true

  image:
    name: image
    needs: [guard, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # publicar no GHCR com o GITHUB_TOKEN (sem token pessoal)
      security-events: write   # SARIF do Trivy na aba Security
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      COMMIT: ${{ needs.guard.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadados (tags e labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Login no GHCR (GITHUB_TOKEN)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As tags do registro são ponteiros mutáveis: impedimos republicar uma versão existente.
      - name: Verificar que a versão ainda não foi publicada
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE_NAME:$VERSION já existe no GHCR. Versões publicadas são imutáveis."
            exit 1
          fi

      - name: Build local da imagem (sem publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: flowboard-api:release-candidate
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy ANTES do push: imagem com vulnerabilidade crítica/alta nunca chega ao registro.
      - name: Trivy — relatório SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowboard-api:release-candidate
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Enviar SARIF para a aba Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-image.sarif
          category: trivy-release

      - name: Trivy — gate (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: flowboard-api:release-candidate
          format: table
          output: trivy-table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Relatório Trivy no resumo da execução
        if: always()
        run: |
          cat trivy-table.txt || true
          {
            echo "### Trivy — vulnerabilidades CRITICAL/HIGH com correção disponível"
            echo '```'
            cat trivy-table.txt 2>/dev/null || echo "(relatório indisponível)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar no GHCR (com SBOM e provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.COMMIT }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Gerar release-manifest.json (versão ↔ commit ↔ digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg version "$VERSION" --arg tag "v$VERSION" --arg commit "$COMMIT" \
                --arg image "$IMAGE_NAME" --arg digest "$DIGEST" --arg run "$RUN_URL" \
                --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$version, tag:$tag, commit:$commit, image:$image, digest:$digest,
              imageRef:($image + "@" + $digest), createdAt:$created, workflowRunUrl:$run}' \
            > release-manifest.json
          cat release-manifest.json
          {
            echo "### Imagem publicada"
            echo "| Versão | Commit | Digest |"
            echo "|---|---|---|"
            echo "| $VERSION | \`${COMMIT:0:7}\` | \`$DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do manifesto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json

  github-release:
    name: github-release
    needs: [guard, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # criar o GitHub Release
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      COMMIT: ${{ needs.guard.outputs.commit }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar manifesto
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest

      - name: Montar notas a partir do CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag' CHANGELOG.md > changelog-section.md
          {
            echo "## Artefato"
            echo
            echo "| Versão | Commit | Digest (referência de deploy) |"
            echo "|---|---|---|"
            echo "| \`$VERSION\` | [\`${COMMIT:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/$COMMIT) | \`$DIGEST\` |"
            echo
            echo '```bash'
            echo "docker pull $IMAGE_NAME@$DIGEST"
            echo "./scripts/deploy.sh $VERSION   # resolve o digest pelo release-manifest.json"
            echo '```'
            echo
            echo "## Mudanças"
            echo
            cat changelog-section.md
          } > release-notes.md
          cat release-notes.md

      - name: Criar GitHub Release
        run: >
          gh release create "v$VERSION" release-manifest.json
          --title "FlowBoard API v$VERSION"
          --notes-file release-notes.md
          --verify-tag

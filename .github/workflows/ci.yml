# Pipeline de Integração Contínua do FlowBoard API.
# Executa em PRs, pushes na main, semanalmente (novas CVEs) e manualmente.
# Também é reutilizado pelo release.yml via workflow_call (sem duplicar etapas).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      is-release:
        description: "true quando chamado pelo release.yml"
        type: boolean
        default: false

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # commit base do PR, usado pela guarda de migrations

      - name: Setup .NET (versão do global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # NuGet Audit roda no restore: vulnerabilidade moderada/alta/crítica quebra o build.
      - name: Restore (locked mode + NuGet Audit)
        run: dotnet restore FlowBoard.slnx --locked-mode

      - name: Relatório de dependências vulneráveis (informativo)
        run: |
          {
            echo "### NuGet Audit — dependências vulneráveis (diretas e transitivas)"
            echo '```'
            dotnet list FlowBoard.slnx package --vulnerable --include-transitive
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR-008: migrations novas precisam ser aditivas (exceto com o rótulo breaking-migration).
      - name: Guarda de migrations destrutivas
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-migration')
        run: scripts/ci/check-migrations.sh HEAD^1 HEAD

      - name: Verificar formatação (.editorconfig)
        run: dotnet format FlowBoard.slnx --verify-no-changes --no-restore

      - name: Build (analyzers, avisos = erro)
        run: dotnet build FlowBoard.slnx -c "$CONFIGURATION" --no-restore

      # Gate de cobertura: mínimo de 80% de linhas no namespace Domain (regras de negócio).
      - name: Testes unitários + gate de cobertura do Domain
        run: >
          dotnet test tests/FlowBoard.UnitTests -c "$CONFIGURATION" --no-build
          --logger GitHubActions --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          "/p:CoverletOutput=$GITHUB_WORKSPACE/TestResults/coverage/unit/"
          "/p:Include=[FlowBoard.Api]FlowBoard.Api.Domain.*"
          /p:Threshold=80 /p:ThresholdType=line

      # API real + PostgreSQL 17 real (Testcontainers usa o Docker do runner).
      - name: Testes de integração (Testcontainers)
        run: >
          dotnet test tests/FlowBoard.IntegrationTests -c "$CONFIGURATION" --no-build
          --logger GitHubActions --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Relatório de cobertura no resumo da execução
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/**/*.cobertura.xml;TestResults/**/coverage.cobertura.xml" \
            -targetdir:TestResults/coverage-report -reporttypes:"MarkdownSummaryGithub" || exit 0
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload dos resultados de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish src/FlowBoard.Api -c "$CONFIGURATION" --no-build -o publish

      - name: Upload do artefato (binários publicados)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flowboard-api-${{ github.sha }}
          path: publish/
          retention-days: 30

  # Verificação de segredos com Gitleaks.
  # pull_request/push: escaneia os commits do PR/push; schedule/workflow_dispatch: TODO o histórico.
  # fetch-depth: 0 é obrigatório para que o histórico (e o commit base) exista localmente.
  secret-scan:
    name: secret-scan
    if: ${{ !inputs.is-release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # sem permissão de escrita em PRs (menor privilégio)
